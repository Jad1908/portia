# The knowledge graph's database (docs/KNOWLEDGE_GRAPH.md §3).
#
#   docker compose up -d neo4j
#   NEO4J_PASSWORD=portia-dev python -m portia.cli.knowledge --write
#
# §3.3 weighs what this costs: portia stops being one command, and that was the
# trade taken deliberately — a container is a one-time setup cost, where owning
# a graph engine, a query layer and a graph UI is a permanent one.
#
# The browser at http://localhost:7474 is the visual layer for now; §6.9 records
# why drawing the graph inside portia's own canvas is a separate purchase, and
# the layout question it has to answer first.
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # http — the browser
      - "7687:7687" # bolt — the driver
    environment:
      # Development only, and it is the same string the tests look for. Nothing
      # in here is data: the graph holds metadata *about* the data (§6.3).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-portia-dev}
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
