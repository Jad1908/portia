[project]
name = "portia"
version = "0.0.1"
description = "Agent-assisted data harmonization copilot — deterministic engine first."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
